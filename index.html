<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Forecaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-background"></div>
    <div class="container">
        <header>
            <h1>Wealth <span class="highlight">Forecaster</span></h1>
            <p>Model your financial future with precision.</p>
        </header>

        <main class="dashboard-grid">
            <section class="controls-panel glass-panel">
                <h2>Financial Inputs</h2>

                <div class="input-group">
                    <label for="annualIncome">Annual Income ($) <span
                            style="float:right; font-size: 0.8em; color: var(--secondary-accent);">Tax: <span
                                id="taxDisplay">$0</span></span></label>
                    <input type="number" id="annualIncome" value="120000" step="1000">
                    <input type="range" id="annualIncomeRange" min="0" max="1000000" value="120000" step="5000">
                </div>

                <div class="input-group">
                    <label for="currentSavings">Current Savings ($)</label>
                    <input type="number" id="currentSavings" value="50000" step="1000">
                    <input type="range" id="currentSavingsRange" min="0" max="1000000" value="50000" step="5000">
                </div>

                <div class="input-group">
                    <label for="stockPortfolio">Stock Portfolio ($)</label>
                    <input type="number" id="stockPortfolio" value="25000" step="1000">
                    <input type="range" id="stockPortfolioRange" min="0" max="1000000" value="25000" step="5000">
                </div>
            </section>

            <section class="levers-panel glass-panel">
                <h2>Growth Levers</h2>

                <div class="slider-group">
                    <div class="label-row">
                        <label for="stockReturn">Stock Appreciation</label>
                        <span id="stockReturnVal" class="value-display">7.0%</span>
                    </div>
                    <input type="range" id="stockReturn" min="-10" max="20" value="7.0" step="0.1">
                </div>

                <div class="slider-group">
                    <div class="label-row">
                        <label for="dividendYield">Dividend Yield</label>
                        <span id="dividendYieldVal" class="value-display">1.5%</span>
                    </div>
                    <input type="range" id="dividendYield" min="0" max="10" value="1.5" step="0.1">
                </div>

                <div class="slider-group">
                    <div class="label-row">
                        <label for="annualRaise">Annual Raise</label>
                        <span id="annualRaiseVal" class="value-display">3.0%</span>
                    </div>
                    <input type="range" id="annualRaise" min="0" max="15" value="3.0" step="0.1">
                </div>

                <div class="slider-group">
                    <div class="label-row">
                        <label for="annualBonus">Annual Bonus</label>
                        <span class="sub-label">(% of Income)</span>
                        <span id="annualBonusVal" class="value-display">10%</span>
                    </div>
                    <input type="range" id="annualBonus" min="0" max="50" value="10" step="1">
                </div>

                <!-- Expenses Section -->
                <div class="expenses-section">
                    <div class="label-row"
                        style="margin-bottom: 1rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem;">
                        <label>Monthly Expenses</label>
                        <span id="totalExpensesDisplay" class="value-display">$0/mo</span>
                    </div>

                    <div id="expensesList" class="expenses-list">
                        <!-- Populated by JS -->
                    </div>

                    <div class="add-expense-row">
                        <input type="text" id="newExpenseName" placeholder="Name" class="mini-input">
                        <input type="number" id="newExpenseAmount" placeholder="$" class="mini-input">
                        <button id="addExpenseBtn" class="btn-add">+</button>
                    </div>
                </div>
            </section>

            <section class="viz-panel glass-panel">
                <div class="chart-container">
                    <canvas id="wealthChart"></canvas>
                </div>
                <div class="stats-row">
                    <div class="stat-card">
                        <h3>Net Worth (10Y)</h3>
                        <p id="netWorth10y" class="stat-value">$0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Saved</h3>
                        <p id="totalPrincipal" class="stat-value">$0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Interest Earned</h3>
                        <p id="totalInterest" class="stat-value">$0</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
